version: '3.8'

services:
  metriplex-node:
    build: .
    image: ntellezm/metriplex:latest
    container_name: metriplex-node
    restart: unless-stopped
    network_mode: host
    volumes:
      - metriplex-data:/data
    environment:
      - API_PORT=${API_PORT:-8000}
      - P2P_PORT=${P2P_PORT:-65432}
      - PEER=${PEER:-157.180.113.24:65432}
      - MINER_PASSWORD=${MINER_PASSWORD:-}
      - MINER_WALLET=${MINER_WALLET:-}
      - NO_MINER=${NO_MINER:-}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/info"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  metriplex-data:
    driver: local
